<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>TEZAS — Мәзір / Меню</title>
<meta name="description" content="Меню TEZAS в ТРК «Орал», Уральск: бургеры, комбо, пицца, донер, фри и напитки.">
<link rel="preload" href="fonts/montserrat-italic-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/montserrat-normal-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Ctext x='16' y='23' font-family='Arial' font-weight='900' font-style='italic' font-size='17' text-anchor='middle' fill='%23FFC20E'%3ET%3C/text%3E%3C/svg%3E">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="brush" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.9" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="14"/>
    </filter>
  </defs>
</svg>

<header class="hero">
  <svg class="slashes" viewBox="0 0 400 300" preserveAspectRatio="xMaxYMin meet" aria-hidden="true">
    <g filter="url(#brush)">
      <path class="s s1" d="M150 -20 L410 210" />
      <path class="s s2" d="M235 -30 L420 140" />
      <path class="s s3" d="M300 -20 L430 95" />
    </g>
  </svg>

  <div class="hero__in">
  <div class="hero__bar">
    <a class="wordmark" href="#top" aria-label="TEZAS">
      <svg class="watch" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="27" r="17" fill="#fff" stroke="#000" stroke-width="4"/>
        <rect x="20" y="3" width="8" height="5" rx="1.5" fill="#000"/>
        <path d="M37 11l4-4" stroke="#000" stroke-width="4" stroke-linecap="round"/>
        <path d="M24 27V16" stroke="#E2231A" stroke-width="4" stroke-linecap="round"/>
        <path d="M24 27l8 5" stroke="#FFC20E" stroke-width="4" stroke-linecap="round"/>
        <circle cx="24" cy="27" r="2.6" fill="#000"/>
      </svg>
      <span class="wordmark__tez">TEZ</span><span class="wordmark__as">AS</span>
    </a>
    <div class="lang" role="group" aria-label="Тіл / Язык">
      <button type="button" data-lang="kk">ҚАЗ</button>
      <button type="button" data-lang="ru">РУС</button>
    </div>
  </div>

  <h1 class="hero__title" id="top">
    <span class="hero__kk">Мәзір</span><span class="hero__ru">Меню</span>
  </h1>
  <p class="hero__tag">Fast • Fresh • Speed</p>
  <p class="sticker" data-t="slogan"></p>
  </div>
</header>

<aside class="promo" aria-live="polite">
  <svg class="promo__cup" viewBox="0 0 32 40" aria-hidden="true">
    <path d="M6 9h20l-2.5 27a3 3 0 0 1-3 2.7h-9a3 3 0 0 1-3-2.7z" fill="#FFC20E" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M4 9h24" stroke="#000" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M18 9l3-8" stroke="#000" stroke-width="2.4" stroke-linecap="round"/>
  </svg>
  <p data-t="promo"></p>
</aside>

<nav class="tabs" aria-label="Категории">
  <div class="tabs__track" id="tabs"></div>
</nav>

<main id="menu"></main>

<footer class="foot">
  <p class="foot__addr" id="addr"></p>
  <p class="foot__links">
    <a id="gis" target="_blank" rel="noopener">2GIS</a>
    <a id="ig" target="_blank" rel="noopener">Instagram</a>
  </p>
  <p class="foot__note" data-t="note"></p>
</footer>

<div class="tray" id="tray" hidden>
  <button type="button" class="tray__bar" id="trayOpen" aria-controls="sheet" aria-expanded="false">
    <svg class="tray__cup" viewBox="0 0 32 40" aria-hidden="true">
      <defs><clipPath id="cupClip"><path d="M6 9h20l-2.5 27a3 3 0 0 1-3 2.7h-9a3 3 0 0 1-3-2.7z"/></clipPath></defs>
      <rect id="cupFill" x="0" y="40" width="32" height="40" fill="#FFC20E" clip-path="url(#cupClip)"/>
      <path d="M6 9h20l-2.5 27a3 3 0 0 1-3 2.7h-9a3 3 0 0 1-3-2.7z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M4 9h24M18 9l3-8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <span class="tray__text">
      <span class="tray__goal" id="trayGoal"></span>
      <span class="tray__count" id="trayCount"></span>
    </span>
    <span class="tray__sum" id="traySum"></span>
  </button>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet__scrim" data-close></div>
  <section class="sheet__panel">
    <header class="sheet__head">
      <h2 id="sheetTitle" data-t="listTitle"></h2>
      <button type="button" class="icon-btn" data-close data-t-label="close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </button>
    </header>
    <ul class="sheet__list" id="sheetList"></ul>
    <div class="sheet__total"><span data-t="total"></span><strong id="sheetSum"></strong></div>
    <p class="sheet__gift" id="sheetGift"></p>
    <p class="sheet__hint" data-t="showCashier"></p>
    <button type="button" class="sheet__clear" id="clearAll" data-t="clear"></button>
  </section>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
